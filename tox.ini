[tox]
envlist =
    ruff
    pylint
    py{311,312,313,314,315}-sphinx{81}
    py{311,312,313,314,315}-sphinx{82,90}
    py{312,313,314,315}-sphinx{91}
    py{313,314,315}-sphinx{92}
    mypy

[testenv]
deps =
    -r{toxinidir}/requirements_dev.txt
    sphinx81: sphinx>=8.1,<8.2
    sphinx82: sphinx>=8.2,<8.3
    sphinx90: sphinx>=9.0,<9.1
    sphinx91: sphinx>=9.1,<9.2
    sphinx92: sphinx>=9.2,<9.3
commands =
    {envpython} -m tests {posargs}
setenv =
    PYTHONDONTWRITEBYTECODE=1
usedevelop = true

[testenv:coverage]
deps =
    coverage
    {[testenv]deps}
commands =
    {envpython} -m coverage run --module tests {posargs}
    - {envpython} -m coverage combine
    {envpython} -m coverage html
    {envpython} -m coverage report

[testenv:{,py311-,py312-,py313-,py314-,py315-}develop]
deps =
    {[testenv]deps}
    git+https://github.com/sphinx-doc/sphinx.git@{env:SPHINX_VER:master}
pip_pre = true

[testenv:{,py311-,py312-,py313-,py314-,py315-}interactive]
commands =
    {envpython} -m sphinxcontrib.confluencebuilder {posargs}
passenv = *

[testenv:{,py311-,py312-,py313-,py314-,py315-}prerelease]
pip_pre = true

[testenv:{,py311-,py312-,py313-,py314-,py315-}release]
usedevelop = false

[testenv:doc-html]
changedir = doc
commands = {envpython} -m sphinx -M html . _build -E -a

[testenv:doc-latexpdf]
changedir = doc
commands = {envpython} -m sphinx -M latexpdf . _build -E -a

[testenv:doc-spelling]
deps =
    {[testenv]deps}
    -r doc/requirements.txt
    sphinxcontrib-spelling
changedir = doc
commands = {envpython} -m sphinx -M spelling . _build -E -a

[testenv:pylint]
deps =
    {[testenv]deps}
    pylint: pylint==4.0.6
commands =
    pylint \
    sphinxcontrib \
    tests

[testenv:ruff]
deps =
    {[testenv]deps}
    ruff: ruff==0.16.1
setenv =
    {[testenv]setenv}
    RUFF_CACHE_DIR={toxworkdir}/.ruff_cache
commands =
    ruff \
    check \
    doc/conf.py \
    sphinxcontrib \
    tests

[testenv:mypy]
deps =
    {[testenv]deps}
    -r{toxinidir}/requirements_types.txt
    mypy: mypy==2.3.0
commands =
    mypy \
    --explicit-package-bases \
    sphinxcontrib

[testenv:{,py311-,py312-,py313-,py314-,py315-}sandbox]
deps =
    -r{toxinidir}/sandbox/requirements.txt
commands =
    {envpython} -m tests.test_sandbox {posargs}
passenv = *

[testenv:{,py311-,py312-,py313-,py314-,py315-}validation]
deps =
    {[testenv]deps}
    -r{toxinidir}/tests/validation-sets/requirements.txt
commands =
    {envpython} -m tests.test_validation {posargs}
passenv = *

[testenv:{,py311-,py312-,py313-,py314-,py315-}validation-develop]
base = validation
deps =
    {[testenv]deps}
    git+https://github.com/sphinx-doc/sphinx.git@{env:SPHINX_VER:master}
pip_pre = true

[testenv:{,py311-,py312-,py313-,py314-,py315-}validation-prerelease]
base = validation
pip_pre = true
